name: Release Python package
# Runs only when a tag like py-v0.2.0 is pushed. Uses PyPI trusted publishing (OIDC): no API token is stored.
on:
  push:
    tags: ['py-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Tag matches the package version
        run: test "py-v$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)" = "${GITHUB_REF_NAME}"
      - name: Test, including JS/Python parity
        run: |
          python -m pip install -e "python[test]" build twine
          python -m pytest python -q
          node scripts/export-data.mjs --check
      - name: Build and check
        run: |
          python -m build python
          python -m twine check python/dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: python/dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentshield-guardrails/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
